<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        background-color: cornflowerblue;
        margin:0;
    }
    .Main{
        width: 50vw;
        height: 80vh;
        background-color: rgb(175, 71, 89);
        position: relative;
        left:25vw;
        top:10vh;
        font-size: x-large;
        color: white;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;


    }
    input{
        width: 300px;
        height: 50px;
        border-radius: 10px;
        }
        button{
            width: 200px;
            height: 50px;
        border-radius: 10px;
        background-color:cornflowerblue;
        color: white;
        font-size: large;
        }
        ::placeholder{
            color: black;
            padding-left: 30px;
        }
        .removebutton{
            background-color: red;
            width: 100px;
            position: absolute;
            right:3vw;
        }
        .sub{
            width: 350px;
            padding-left: 20px;
            height: 50px;
            background-color: rgb(156, 141, 161);
            color:aliceblue;
            border: 2px solid white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            margin-top: 10px;
            margin-left: 15px;
            position: relative;
        }
        .sub span{
            position: absolute;
            left: 2vw;
            text-align: left;
        }
        #todolist{
            width: 100%;
            height: 60%;
            overflow-y: scroll;
        }
        
</style>
<body>
    <div class="Main">
         <h1>To Do List</h1>
         <input type="text" id="todoinput" placeholder="Enter task">
          <button onclick="addToDo()">Add task</button>
          
          <div id="todolist">
            

          </div>
        </div>

        <script>
            function addToDo(){
              let taskvalue = document.getElementById("todoinput").value;
                if(taskvalue==""){
                    return;
                }
                let taskstore=document.createElement("div");
                taskstore.className="sub";
                let tasktext=document.createElement("span");
                tasktext.innerText=taskvalue;
                let removebutton=document.createElement("button");
                removebutton.innerText="Remove";
                removebutton.className="removebutton";
                removebutton.onclick=function(){
                    taskstore.remove();
                }
                taskstore.appendChild(tasktext);
                taskstore.appendChild(removebutton);

                document.getElementById("todolist").appendChild(taskstore);
                document.getElementById("todoinput").value="";
            }
        </script>
    
</body>
</html>
